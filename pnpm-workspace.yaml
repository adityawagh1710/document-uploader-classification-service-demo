# pnpm workspace for the document-uploader monorepo (TS units).
# Go units (units/ingestion-service/ingestion-subgraph, libs/pipeline-contracts/go)
# are managed by per-unit go.mod, not pnpm.
#
# Migration note: the TS units still carry npm package-lock.json (verified
# working). To complete the pnpm migration run, at repo root:
#   corepack use pnpm@9 && pnpm install      # generates pnpm-lock.yaml
# then delete the per-unit package-lock.json. Deferred from the layout move to
# avoid destabilising the just-verified build.
packages:
  - "units/classification-service"
  - "units/document-uploader-ui"
