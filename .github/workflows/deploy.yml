name: Deploy

# Auto-deploy on push to main is DISABLED until the operator hand-off
# completes. Currently failing because:
#   • infra/config/{dev,staging,prod}.ts use placeholder AWS account IDs
#   • No OpenID Connect provider registered in any AWS account
#     for token.actions.githubusercontent.com / sts.amazonaws.com
#   • No IAM role + trust policy gating this repo + branch
#   • `cdk bootstrap` not run in any target account/region
#   • SNS topic + SSM /observability/sns-topic-arn/<env> not seeded
#   • GitHub secret AWS_DEPLOY_ROLE_<ENV> not set
#
# See aidlc-docs/construction/build-and-test/build-and-test-summary.md §7
# for the full hand-off list. workflow_dispatch is still operational for
# all three environments via the deploy-prod / deploy-manual jobs below.
#
# To re-enable auto-deploy after the hand-off:
#   1. Add the `push:` block under `on:`:
#        push:
#          branches: [main]
#          paths:
#            - "infra/**"
#            - "src/**"
#            - "package.json"
#            - "package-lock.json"
#   2. Re-add deploy-dev + deploy-staging jobs that mirror deploy-manual
#      but with `if: github.event_name == 'push'` (and `needs: deploy-dev`
#      on staging). Use the real account IDs / OIDC role ARNs once the
#      hand-off has provisioned them.

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to deploy"
        required: true
        type: choice
        options: [dev, staging, prod]

permissions:
  id-token: write   # OIDC
  contents: read

# Classification now lives under units/classification-service (monorepo layout).
defaults:
  run:
    working-directory: units/classification-service

jobs:
  deploy-prod:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.env == 'prod'
    name: Deploy (prod)
    runs-on: ubuntu-latest
    environment: prod   # GitHub environment protection requires manual approval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::333333333333:role/github-actions-deploy
          aws-region: us-east-1
      - run: npx cdk deploy --all -c env=prod --require-approval never

  deploy-manual:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.env != 'prod'
    name: Deploy (manual ${{ github.event.inputs.env }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ github.event.inputs.env == 'dev' && '111111111111' || '222222222222' }}:role/github-actions-deploy
          aws-region: us-east-1
      - run: npx cdk deploy --all -c env=${{ github.event.inputs.env }} --require-approval never
