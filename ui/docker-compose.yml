# Local test stack — LocalStack (S3 + DDB + SFN) + the Next.js UI.
#
# Run from the *repository root*, not from ui/, because the Dockerfile
# references ../src as build context:
#
#   docker compose -f ui/docker-compose.yml up --build
#
# UI:        http://localhost:3000
# LocalStack health: http://localhost:4566/_localstack/health

services:
  localstack:
    image: localstack/localstack:3.7.0
    environment:
      SERVICES: s3,dynamodb,stepfunctions
      DEFAULT_REGION: us-east-1
      PERSISTENCE: "0"
      DEBUG: "0"
    ports:
      - "4566:4566"
    healthcheck:
      # LocalStack reports each service as one of: disabled / available / running / error.
      # We require both s3 and dynamodb to be in a ready state — accept both
      # 'available' (lazy-initialized) and 'running' (already touched).
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -qE '\"s3\": \"(available|running)\"' && curl -fsS http://localhost:4566/_localstack/health | grep -qE '\"dynamodb\": \"(available|running)\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  ui:
    image: classification-service-ui:dev
    build:
      context: ..
      dockerfile: ui/Dockerfile
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      UI_S3_BUCKET: classification-ui-bucket
      CONTENT_HASH_TABLE_NAME: content-hashes-ui
      WORKSPACE_CONFIG_TABLE_NAME: workspace-config-ui
    ports:
      - "3000:3000"
