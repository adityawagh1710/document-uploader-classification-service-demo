# LocalStack inside the cluster — keeps the test loop self-contained.
# Swap this out and point AWS_ENDPOINT_URL at real AWS via IRSA when you're
# ready to test against the deployed Lambda's adapters.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: classification-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3.7.0
          ports:
            - containerPort: 4566
              name: edge
          env:
            - name: SERVICES
              value: s3,dynamodb,stepfunctions
            - name: DEFAULT_REGION
              value: us-east-1
            - name: PERSISTENCE
              value: "0"
            - name: DEBUG
              value: "0"
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: classification-ui
spec:
  selector:
    app: localstack
  ports:
    - port: 4566
      targetPort: 4566
      name: edge
