# Optional — Ingress for AWS Load Balancer Controller on EKS. Skip and use
# `kubectl port-forward` if the cluster has no ingress controller installed.
#
# Set classification-ui.dev.example.com to your real dev hostname before apply.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: classification-ui
  namespace: classification-ui
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  rules:
    - host: classification-ui.dev.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: classification-ui
                port:
                  number: 80
