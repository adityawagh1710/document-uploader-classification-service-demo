apiVersion: v1
kind: ConfigMap
metadata:
  name: classification-ui-config
  namespace: classification-ui
data:
  AWS_ENDPOINT_URL: "http://localstack:4566"
  AWS_REGION: "us-east-1"
  # LocalStack accepts any creds — these placeholders satisfy the SDK.
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
  UI_S3_BUCKET: "classification-ui-bucket"
  CONTENT_HASH_TABLE_NAME: "content-hashes-ui"
  WORKSPACE_CONFIG_TABLE_NAME: "workspace-config-ui"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: classification-ui
  namespace: classification-ui
  labels:
    app: classification-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: classification-ui
  template:
    metadata:
      labels:
        app: classification-ui
    spec:
      # Replace IMAGE_REGISTRY with your registry (ECR, GHCR, etc).
      # Build + push first:
      #   docker build -f ui/Dockerfile -t IMAGE_REGISTRY/classification-service-ui:dev .
      #   docker push IMAGE_REGISTRY/classification-service-ui:dev
      containers:
        - name: ui
          image: IMAGE_REGISTRY/classification-service-ui:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: classification-ui-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # 1 GiB memory limit pairs with the 1 GiB upload cap in
          # ui/app/api/classify/route.ts. Multipart streaming keeps actual
          # usage well below the cap, but headroom matters when Node V8
          # holds onto buffers + the file's intermediate parts.
---
apiVersion: v1
kind: Service
metadata:
  name: classification-ui
  namespace: classification-ui
spec:
  selector:
    app: classification-ui
  ports:
    - port: 80
      targetPort: 3000
      name: http
