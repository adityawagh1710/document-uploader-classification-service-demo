openapi: 3.1.0
info:
  title: Classification Service — Test UI API
  version: 1.0.0
  description: |
    Hand-written OpenAPI spec for the classification-ui Next.js dashboard's
    HTTP API. Spec is the single source of truth — endpoints live under
    `ui/app/api/**` and the schemas mirror `src/shared/types.ts` +
    `src/application/types.ts`.

    Same dashboard backs both LocalStack (`AWS_ENDPOINT_URL` set) and real
    AWS (IRSA) modes — the contract is identical.

    Live Swagger UI: `<host>/docs` (served by `ui/app/docs/page.tsx`).
  license:
    name: Internal — Opus 2

servers:
  - url: https://classification-ui-dev-sandbox-v1.dev05.k8s.opus2dev.com
    description: dev05 EKS (ALB + IP allowlist)
  - url: http://localhost:3000
    description: Local dev (`npm run dev` or docker-compose)

tags:
  - name: classify
    description: Submit a document and get its classification.
  - name: workspaces
    description: Workspace policy seeding + read.
  - name: introspection
    description: Health, target info, KPI counters.
  - name: history
    description: Look up a prior classification by document id.

paths:
  /api/classify:
    post:
      tags: [classify]
      summary: Classify a document
      description: |
        Streams the file to S3 (multipart Upload, 8 MiB parts × 4-way), then
        invokes the classifier service. Returns the classification decision +
        dedup metadata. File size capped at 1 GiB; detection window is only
        the first 4 100 bytes — the rest just feeds the SHA-256 dedup hash.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, workspaceId]
              properties:
                file:
                  type: string
                  format: binary
                  description: The document binary (any format).
                workspaceId:
                  type: string
                  example: wks-ui-001
                  description: |
                    Workspace policy to evaluate against. Auto-seeded
                    `wks-ui-001` exists on cold start.
                extension:
                  type: string
                  description: |
                    Format hint without the dot (e.g. `pptx`). Used as
                    extension fallback when content detection fails and as
                    last-resort OOXML/OLE2 disambiguator.
                  example: pptx
                contentType:
                  type: string
                  description: MIME type hint.
                  example: application/vnd.openxmlformats-officedocument.presentationml.presentation
                overrideDuplicateCheck:
                  type: string
                  enum: ["true", "false"]
                  default: "false"
                  description: |
                    Set to `"true"` to bypass dedup — forces a fresh
                    classification + re-write of the content-hash record
                    even if this hash was already seen.
                parentArchiveDepth:
                  type: integer
                  default: 0
                  description: |
                    Nesting depth if the doc came from inside an archive.
                    Trips the `max-zip-depth` slipsheet rule above the
                    workspace's `maxZipDepth`.
      responses:
        "200":
          description: Classification successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassifyResponseSuccess"
              examples:
                pptx:
                  summary: PowerPoint document
                  value:
                    ok: true
                    elapsedMs: 142
                    documentId: doc-ec20716b-81a4-47b2-bd93-72637a39b078
                    objectKey: ui/doc-ec20716b-81a4-47b2-bd93-72637a39b078/Wonders.pptx
                    inputName: Wonders.pptx
                    result:
                      documentId: doc-ec20716b-81a4-47b2-bd93-72637a39b078
                      workspaceId: wks-ui-001
                      classification:
                        format: pptx
                        category: convert
                        subCategory: office
                        confidenceScore: 0.95
                        detectionTier: zip-marker
                        isForcedSlipsheet: false
                        slipsheetReason: null
                      dedup:
                        contentHash: f9984dff61be1fbfe4f0e6fe4e4879bc3f994155d5f2882e27e66008002f617a
                        isDuplicate: false
                      policyVersion: v1
        "400":
          description: Missing required form fields (`file` or `workspaceId`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "413":
          description: File exceeds 1 GiB cap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "422":
          description: |
            Classifier returned a deterministic failure (input validation,
            store error, etc.). Body includes the structured failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassifyResponseFailure"
        "502":
          description: Upstream S3 upload failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /api/health:
    get:
      tags: [introspection]
      summary: Readiness probe
      description: |
        Hits DynamoDB `ListTables` against the configured endpoint
        (LocalStack or real AWS). Returns `ready: true` + table list on
        success; 503 if the backing store is unreachable.

        This is the same path used by the Helm chart's pod readiness +
        liveness probes and the ALB target-group health check.
      responses:
        "200":
          description: Backing store reachable.
          content:
            application/json:
              schema:
                type: object
                required: [ready, endpoint, tables, latencyMs]
                properties:
                  ready: { type: boolean, example: true }
                  endpoint: { type: string, example: "http://localstack:4566" }
                  tables: { type: array, items: { type: string } }
                  latencyMs: { type: integer, example: 12 }
        "503":
          description: Backing store unreachable.
          content:
            application/json:
              schema:
                type: object
                required: [ready, endpoint, error]
                properties:
                  ready: { type: boolean, example: false }
                  endpoint: { type: string }
                  error: { type: string }

  /api/target:
    get:
      tags: [introspection]
      summary: Active AWS surface info
      description: |
        Operator-facing summary of which AWS endpoint/region/bucket/tables
        the UI is currently wired to. The `backend` field flips between
        `"localstack"` and `"real-aws"` based on whether `AWS_ENDPOINT_URL`
        is set.
      responses:
        "200":
          description: Target info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"

  /api/stats:
    get:
      tags: [introspection]
      summary: In-memory KPI counters
      description: |
        Snapshot of the dashboard's running counters: total classifications,
        per-tier breakdown, success/error/slipsheet rates, recent 25-100
        runs. Resets on pod restart — these are intentionally non-persistent.
      responses:
        "200":
          description: Stats snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSnapshot"

  /api/workspaces:
    get:
      tags: [workspaces]
      summary: List workspace configs
      description: Scans the `workspace-config` DDB table.
      responses:
        "200":
          description: Workspace list.
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items: { $ref: "#/components/schemas/WorkspaceConfig" }
    post:
      tags: [workspaces]
      summary: Seed or overwrite a workspace config
      description: |
        Upserts a row in `workspace-config`. Missing fields fall back to
        defaults (`policyVersion=v1`, `threshold=0.5`, `maxZipDepth=5`,
        `quarantineMacros=false`, `slipsheetRules={}`, `hashTtlDays=null`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId]
              properties:
                workspaceId: { type: string, example: wks-ui-001 }
                policyVersion: { type: string, example: v1 }
                threshold: { type: number, format: float, example: 0.5 }
                maxZipDepth: { type: integer, example: 5 }
                quarantineMacros: { type: boolean, example: false }
                slipsheetRules:
                  type: object
                  additionalProperties:
                    type: string
                    enum: [always-slipsheet]
                  example: { "psd": "always-slipsheet" }
                hashTtlDays:
                  oneOf:
                    - { type: integer }
                    - { type: "null" }
                  example: null
      responses:
        "200":
          description: Workspace upserted.
          content:
            application/json:
              schema:
                type: object
                required: [workspace]
                properties:
                  workspace: { $ref: "#/components/schemas/WorkspaceConfig" }
        "400":
          description: Missing `workspaceId` or invalid JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /api/runs/{documentId}:
    get:
      tags: [history]
      summary: Look up a prior classification's persisted state
      description: |
        Returns the DynamoDB `content-hashes` row (joined by
        `workspaceId` + `contentHash`) and the S3 object metadata for the
        specified document. Used by the Result panel in the dashboard.
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string }
          example: doc-ec20716b-81a4-47b2-bd93-72637a39b078
        - name: workspaceId
          in: query
          required: true
          schema: { type: string }
          example: wks-ui-001
        - name: contentHash
          in: query
          required: false
          schema: { type: string }
          description: SHA-256 hex. Omit to skip DDB lookup.
        - name: objectKey
          in: query
          required: false
          schema: { type: string }
          description: S3 key. Omit to skip S3 metadata lookup.
      responses:
        "200":
          description: |
            Joined view. Note `ddbRow` and `s3Object` are independently
            nullable — either may be `null` if the query params were
            omitted or the underlying lookup failed.
          content:
            application/json:
              schema:
                type: object
                required: [documentId, workspaceId, ddbRow, s3Object, bucket, table]
                properties:
                  documentId: { type: string }
                  workspaceId: { type: string }
                  ddbRow:
                    oneOf:
                      - { $ref: "#/components/schemas/ContentHashRecord" }
                      - { type: "null" }
                  s3Object:
                    oneOf:
                      - $ref: "#/components/schemas/S3ObjectMetadata"
                      - { type: "null" }
                  bucket: { type: string }
                  table: { type: string }
        "400":
          description: Missing `workspaceId` query param.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

components:
  schemas:
    Category:
      type: string
      description: Routing decision — where the document goes downstream.
      enum: [ocr-direct, media, convert, email, archive, slipsheet]

    SubCategory:
      description: |
        Sub-routing under `category`. `null` for categories that don't
        sub-divide. `convert-then-ocr` fires when an OLE2 office doc
        comes in via CLSID detection.
      oneOf:
        - type: string
          enum: [office, image, tiff, html, convert-then-ocr]
        - { type: "null" }

    DetectionTier:
      type: string
      description: |
        Which detector won the classification. Reflects the cascading
        Tier 1 → Tier 2 OLE2 / ZIP → Tier 3 text → extension fallback flow.
      enum: [file-type, ole2-clsid, zip-marker, text-heuristic, extension-fallback]

    SlipsheetReason:
      description: |
        Why the document was forced into the slipsheet category. `null`
        when no slipsheet override fired.
      oneOf:
        - type: string
          enum: [workspace-policy, max-zip-depth, low-confidence]
        - { type: "null" }

    ClassificationDecision:
      type: object
      required: [format, category, subCategory, confidenceScore, detectionTier, isForcedSlipsheet, slipsheetReason]
      properties:
        format:
          type: string
          description: The detected format (e.g. `doc`, `pdf`, `xlsx`, `eml`).
          example: pptx
        category: { $ref: "#/components/schemas/Category" }
        subCategory: { $ref: "#/components/schemas/SubCategory" }
        confidenceScore:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.95
        detectionTier: { $ref: "#/components/schemas/DetectionTier" }
        isForcedSlipsheet:
          type: boolean
          description: |
            `true` if the document would normally route elsewhere but the
            slipsheet decider forced it into slipsheet (workspace policy,
            zip depth, or low confidence).
        slipsheetReason: { $ref: "#/components/schemas/SlipsheetReason" }

    DedupInfo:
      type: object
      required: [contentHash, isDuplicate]
      properties:
        contentHash:
          type: string
          description: SHA-256 hex of the document body.
          example: f9984dff61be1fbfe4f0e6fe4e4879bc3f994155d5f2882e27e66008002f617a
        isDuplicate:
          type: boolean
          description: |
            `true` if this content hash was already recorded for this
            workspace at classify time (per the `content-hashes` table).

    ClassificationOutput:
      type: object
      required: [documentId, workspaceId, classification, dedup, policyVersion]
      properties:
        documentId: { type: string, example: doc-ec20716b-81a4-47b2-bd93-72637a39b078 }
        workspaceId: { type: string, example: wks-ui-001 }
        classification: { $ref: "#/components/schemas/ClassificationDecision" }
        dedup: { $ref: "#/components/schemas/DedupInfo" }
        policyVersion: { type: string, example: v1 }

    ClassificationFailure:
      type: object
      required: [kind]
      description: Structured failure from the classifier service.
      oneOf:
        - type: object
          required: [kind, field, message]
          properties:
            kind: { type: string, enum: [input-validation] }
            field: { type: string }
            message: { type: string }
        - type: object
          required: [kind, reason]
          properties:
            kind: { type: string, enum: [s3, store, signal] }
            reason: { type: string }
        - type: object
          required: [kind, message]
          properties:
            kind: { type: string, enum: [unexpected] }
            message: { type: string }

    ClassifyResponseSuccess:
      type: object
      required: [ok, result, elapsedMs, documentId, objectKey, inputName]
      properties:
        ok: { type: boolean, enum: [true] }
        result: { $ref: "#/components/schemas/ClassificationOutput" }
        elapsedMs: { type: integer, example: 142 }
        documentId: { type: string }
        objectKey: { type: string }
        inputName: { type: string }

    ClassifyResponseFailure:
      type: object
      required: [ok, error, elapsedMs, documentId, objectKey]
      properties:
        ok: { type: boolean, enum: [false] }
        error: { $ref: "#/components/schemas/ClassificationFailure" }
        elapsedMs: { type: integer }
        documentId: { type: string }
        objectKey: { type: string }

    WorkspaceConfig:
      type: object
      required: [workspaceId, policyVersion, threshold, maxZipDepth, quarantineMacros, slipsheetRules, hashTtlDays]
      properties:
        workspaceId: { type: string, example: wks-ui-001 }
        policyVersion: { type: string, example: v1 }
        threshold:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.5
          description: Minimum confidenceScore for the result to NOT be slipsheeted as low-confidence.
        maxZipDepth:
          type: integer
          minimum: 0
          example: 5
          description: Slipsheet anything nested deeper than this.
        quarantineMacros:
          type: boolean
          description: Force slipsheet for `.docm`/`.xlsm`/`.pptm`.
        slipsheetRules:
          type: object
          additionalProperties:
            type: string
            enum: [always-slipsheet]
          description: Per-format always-slipsheet overrides.
          example: { "psd": "always-slipsheet" }
        hashTtlDays:
          oneOf:
            - { type: integer, minimum: 0 }
            - { type: "null" }
          description: DDB TTL for content-hash records. `null` = no TTL.

    ContentHashRecord:
      type: object
      required: [workspaceId, contentHash, firstSeenAt, firstDocumentId, format, policyVersion, lastSeenAt, hitCount]
      properties:
        workspaceId: { type: string }
        contentHash: { type: string }
        firstSeenAt: { type: string, format: date-time }
        firstDocumentId: { type: string }
        format: { type: string }
        policyVersion: { type: string }
        lastSeenAt: { type: string, format: date-time }
        hitCount: { type: integer, minimum: 1 }
        expiresAt:
          type: integer
          description: UNIX seconds, DDB TTL attribute. Absent if no TTL.

    S3ObjectMetadata:
      type: object
      required: [key, size, contentType, etag, lastModified]
      properties:
        key: { type: string }
        size:
          oneOf:
            - { type: integer }
            - { type: "null" }
        contentType:
          oneOf:
            - { type: string }
            - { type: "null" }
        etag:
          oneOf:
            - { type: string }
            - { type: "null" }
        lastModified:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }

    Target:
      type: object
      required: [endpoint, region, bucket, contentHashTable, workspaceConfigTable, backend]
      properties:
        endpoint: { type: string, example: "http://localstack:4566" }
        region: { type: string, example: us-east-1 }
        bucket: { type: string, example: classification-ui-bucket }
        contentHashTable: { type: string, example: content-hashes-ui }
        workspaceConfigTable: { type: string, example: workspace-config-ui }
        backend:
          type: string
          enum: [localstack, real-aws]

    StatsSnapshot:
      type: object
      description: |
        Shape is best-effort — counters are added/removed as the dashboard
        evolves. See `ui/lib/stats.ts` for the authoritative type.
      additionalProperties: true

    ErrorMessage:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }
