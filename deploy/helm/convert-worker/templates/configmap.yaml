apiVersion: v1
kind: ConfigMap
metadata:
  name: convert-worker-config
  namespace: {{ include "convert-worker.namespace" . }}
  labels:
    {{- include "convert-worker.labels" . | nindent 4 }}
data:
  CONVERT_QUEUE_URL: {{ required "values.worker.convertQueueUrl is required" .Values.worker.convertQueueUrl | quote }}
  SQS_WAIT_TIME_SECONDS: {{ .Values.worker.sqsWaitTimeSeconds | quote }}
  SQS_MAX_MESSAGES: {{ .Values.worker.sqsMaxMessages | quote }}
  OFFICE_CONVERT_BASE_URL: {{ .Values.worker.officeConvertBaseUrl | quote }}
  OFFICE_CONVERT_TIMEOUT_MS: {{ .Values.worker.officeConvertTimeoutMs | quote }}
  CLASSIFICATIONS_TABLE_NAME: {{ .Values.worker.classificationsTableName | quote }}
  AWS_REGION: {{ .Values.worker.awsRegion | quote }}
  {{- if .Values.worker.awsEndpointUrl }}
  AWS_ENDPOINT_URL: {{ .Values.worker.awsEndpointUrl | quote }}
  {{- end }}
  EXCLUDE_DWG: {{ .Values.worker.excludeDwg | quote }}
  LOG_LEVEL: {{ .Values.worker.logLevel | quote }}
  WORKER_VERSION: {{ .Values.worker.workerVersion | quote }}
