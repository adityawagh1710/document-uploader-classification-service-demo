apiVersion: v1
kind: ConfigMap
metadata:
  name: ingestion-subgraph-config
  namespace: {{ include "ingestion-subgraph.namespace" . }}
  labels:
    {{- include "ingestion-subgraph.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.service.port | quote }}
  BACKEND: {{ .Values.router.backend | quote }}
  AWS_REGION: {{ .Values.router.awsRegion | quote }}
  {{- if .Values.router.awsEndpointUrl }}
  AWS_ENDPOINT_URL: {{ .Values.router.awsEndpointUrl | quote }}
  {{- end }}
  DOCUPLOADER_STAGING_BUCKET: {{ .Values.router.stagingBucket | quote }}
  WORKSPACES_TABLE_NAME: {{ .Values.router.workspacesTableName | quote }}
  DOCUMENTS_TABLE_NAME: {{ .Values.router.documentsTableName | quote }}
  CONTENT_HASH_TABLE_NAME: {{ .Values.router.contentHashTableName | quote }}
  CLASSIFICATIONS_TABLE_NAME: {{ .Values.router.classificationsTableName | quote }}
  WORKSPACE_CONFIG_TABLE_NAME: {{ .Values.router.workspaceConfigTableName | quote }}
  EMAIL_EXTRACTIONS_TABLE_NAME: {{ .Values.router.emailExtractionsTableName | quote }}
  CLASSIFY_URL: {{ .Values.router.classifyUrl | quote }}
  {{- if .Values.router.convertQueueUrl }}
  CONVERT_QUEUE_URL: {{ .Values.router.convertQueueUrl | quote }}
  {{- end }}
  {{- if .Values.router.zipExtractionQueueUrl }}
  ZIP_EXTRACTION_QUEUE_URL: {{ .Values.router.zipExtractionQueueUrl | quote }}
  {{- end }}
  {{- if .Values.router.stateMachineArn }}
  STATE_MACHINE_ARN: {{ .Values.router.stateMachineArn | quote }}
  {{- end }}
  {{- if .Values.router.archiveStateMachineArn }}
  ARCHIVE_STATE_MACHINE_ARN: {{ .Values.router.archiveStateMachineArn | quote }}
  {{- end }}
  {{- if .Values.router.officeConvertApiUrl }}
  OFFICE_CONVERT_API_URL: {{ .Values.router.officeConvertApiUrl | quote }}
  {{- end }}
  {{- if .Values.router.emailExtractionUrl }}
  EMAIL_EXTRACTION_URL: {{ .Values.router.emailExtractionUrl | quote }}
  {{- end }}
  DEFAULT_TENANT_ID: {{ .Values.router.defaultTenantId | quote }}
  CORS_ORIGIN: {{ .Values.router.corsOrigin | quote }}
  LOG_LEVEL: {{ .Values.router.logLevel | quote }}
