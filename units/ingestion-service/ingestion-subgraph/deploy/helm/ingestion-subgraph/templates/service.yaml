apiVersion: v1
kind: Service
metadata:
  name: ingestion-subgraph
  namespace: {{ include "ingestion-subgraph.namespace" . }}
  labels:
    {{- include "ingestion-subgraph.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ingestion-subgraph.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
