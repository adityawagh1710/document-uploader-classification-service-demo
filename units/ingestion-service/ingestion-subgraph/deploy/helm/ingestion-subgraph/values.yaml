# Defaults for ingestion-subgraph (the BFF router). Required at install (no defaults):
#   --set image.repository=537462380503.dkr.ecr.eu-west-1.amazonaws.com/classification-service-sandbox/ingestion-subgraph
#   --set image.tag=<git-sha>
#   --set serviceAccount.roleArn=arn:aws:iam::537462380503:role/ingestion-subgraph-irsa
#
# This is the full-BFF router: it owns ALL AWS access (S3 presign/claim-check,
# the classification engine's DDB tables, the stage queues) and calls the
# in-cluster classification-service-http over HTTP for synchronous classify.
# The UI is a pure GraphQL client of this service (no AWS role).

namespace:
  create: false
  name: classification-service-sandbox

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

# Stateless request/response → multiple replicas + RollingUpdate.
replicaCount: 2

serviceAccount:
  create: true
  # MUST match the IRSA trust policy's system:serviceaccount:<ns>:<name>.
  name: ingestion-subgraph
  # IRSA role ARN. REQUIRED in aws mode on dev05; empty in LocalStack-mode dev loop.
  roleArn: ""

service:
  port: 8080

router:
  backend: "aws"                 # memory | aws
  awsRegion: "eu-west-1"
  awsEndpointUrl: ""             # empty on dev05 (regional); http://localstack:4566 locally
  stagingBucket: "classification-ui-dev05"
  # Document/workspace store (the BFF document CRUD surface).
  workspacesTableName: "workspaces-dev"
  documentsTableName: "documents-dev"
  # Classification-engine tables the BFF reads/writes directly.
  contentHashTableName: "content-hashes-dev"
  classificationsTableName: "classifications-dev"
  workspaceConfigTableName: "workspace-config-dev"
  emailExtractionsTableName: "email-extractions-dev"
  # Synchronous classify backend — the in-cluster classification-service-http.
  classifyUrl: "http://classification-service-http.classification-service-sandbox.svc.cluster.local:8091"
  # Stage fan-out queues (full https SQS URLs). Empty string disables the fan-out.
  #   convert  → OUR queue (ClassificationConvertQueue-dev CDK stack)
  #   archive  → the external zip-extraction service's queue (it owns it)
  convertQueueUrl: "https://sqs.eu-west-1.amazonaws.com/537462380503/classification-convert-queue-dev"
  zipExtractionQueueUrl: "https://sqs.eu-west-1.amazonaws.com/537462380503/zip-extraction-dev05"
  # Step Functions ARNs — OPTIONAL. When BOTH are empty (the dev05 default until
  # the SFN pipeline stack is deployed), convert/archive dispatch goes DIRECTLY
  # to the queues above (the pre-SFN path). Set these once the state machines
  # exist on dev05 to route through Step Functions instead.
  stateMachineArn: ""
  archiveStateMachineArn: ""
  # Office-convert progress polling (optional) — the in-cluster office-convert API.
  officeConvertApiUrl: "http://office-convert.office-convert-dev.svc.cluster.local"
  # Email fan-out (optional) — no email service on dev05, so left empty.
  emailExtractionUrl: ""
  defaultTenantId: "tenant-dev"
  corsOrigin: "*"                # tighten to the UI origin on dev05
  logLevel: "info"

# Guaranteed-QoS pod (requests == limits), per the platform standard.
resources:
  requests: { cpu: "100m", memory: "128Mi" }
  limits: { cpu: "100m", memory: "128Mi" }

# HTTP service → httpGet probes on /healthz (unlike the convert-worker poller's exec probe).
readinessProbe:
  httpGet: { path: /healthz, port: 8080 }
  initialDelaySeconds: 3
  periodSeconds: 10
livenessProbe:
  httpGet: { path: /healthz, port: 8080 }
  initialDelaySeconds: 5
  periodSeconds: 15

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
