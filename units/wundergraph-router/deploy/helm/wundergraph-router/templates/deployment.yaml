apiVersion: apps/v1
kind: Deployment
metadata:
  name: wundergraph-router
  namespace: {{ include "wundergraph-router.namespace" . }}
  labels:
    {{- include "wundergraph-router.labels" . | nindent 4 }}
    {{- include "wundergraph-router.selector" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Stateless request/response → RollingUpdate (unlike the convert-worker poller's Recreate).
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "wundergraph-router.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wundergraph-router.selector" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "wundergraph-router.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: router
          image: {{ include "wundergraph-router.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: wundergraph-router-config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
