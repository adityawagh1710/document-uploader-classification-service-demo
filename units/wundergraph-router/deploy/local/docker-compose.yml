# Local integration stack for wundergraph-router: LocalStack (S3 + DynamoDB +
# SQS) + a one-shot bootstrap seed. Mirrors classification's docker-compose
# pattern (LocalStack 3.7.0, eu-west-1, aws-cli bootstrap container).
#
# Run the router on the host against this stack (BACKEND=aws):
#
#   docker compose -f deploy/local/docker-compose.yml up -d
#   QUEUE_CLASSIFY=$(aws --endpoint-url http://localhost:4566 sqs get-queue-url \
#       --queue-name classification-classify-queue --query QueueUrl --output text)
#   BACKEND=aws AWS_ENDPOINT_URL=http://localhost:4566 AWS_REGION=eu-west-1 \
#     AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test \
#     DOCUPLOADER_STAGING_BUCKET=classification-ui-bucket \
#     WORKSPACES_TABLE_NAME=workspaces-ui DOCUMENTS_TABLE_NAME=documents-ui \
#     QUEUE_CLASSIFY="$QUEUE_CLASSIFY" PORT=8081 \
#     go run ./cmd/wundergraph-router

services:
  localstack:
    image: localstack/localstack:3.7.0
    environment:
      SERVICES: s3,dynamodb,sqs
      DEFAULT_REGION: eu-west-1
      PERSISTENCE: "0"
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -qE '\"sqs\": \"(available|running)\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  bootstrap:
    image: amazon/aws-cli:2.17.0
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-1
      AWS_ENDPOINT_URL: http://localstack:4566
      DOCUPLOADER_STAGING_BUCKET: classification-ui-bucket
      WORKSPACES_TABLE_NAME: workspaces-ui
      DOCUMENTS_TABLE_NAME: documents-ui
      CLASSIFY_QUEUE_NAME: classification-classify-queue
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    volumes:
      - ./bootstrap.sh:/bootstrap.sh:ro
    restart: "no"
