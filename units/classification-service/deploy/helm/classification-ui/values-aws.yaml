# Real-AWS profile for dev05 — FULL-BFF topology.
#
# The UI is now a PURE router client: it holds NO AWS SDK, NO IRSA role, and
# talks GraphQL to the in-cluster ingestion-subgraph (the router/BFF), which
# owns all AWS access. This replaces the old Option-A in-process classifier
# (CLASSIFIER_AWS_MODE + direct DynamoDB/S3 via classification-ui-irsa).
#
# Deploy order: classification-service-http → ingestion-subgraph (router) → UI.
# See deploy/AWS_TOPOLOGY.md for the full runbook.
#
# Layer this ON TOP of values.yaml:
#   helm upgrade --install classification-ui deploy/helm/classification-ui \
#     -f deploy/helm/classification-ui/values.yaml \
#     -f deploy/helm/classification-ui/values-aws.yaml \
#     --set image.repository=<acct>.dkr.ecr.eu-west-1.amazonaws.com/<repo> \
#     --set image.tag=<git-sha>

# The namespace is a SHARED resource in the 3-pod BFF topology (UI + router +
# classification-service-http all live in it), so the UI chart must NOT own it —
# otherwise `helm uninstall classification-ui` would delete the namespace out
# from under the still-running router + http. On dev05 the namespace lifecycle is
# imperative: created by the first `helm --create-namespace` (bff-deploy) and
# dropped last by `make bff-undeploy` / `make ns-delete`.
namespace:
  create: false

# No in-cluster LocalStack — and (because localstackConfig is gated on this)
# the LocalStack endpoint + "test" creds are omitted from the pod env.
localstack:
  enabled: false

# The UI no longer needs an AWS identity — it never touches AWS directly. No
# IRSA ServiceAccount is created; the pod runs under the namespace default SA.
serviceAccount:
  create: false

config:
  # Browser-direct SPA on a ClusterIP-only router: the browser MUST call
  # same-origin, so GRAPHQL_URL is the relative "/graphql" and nginx proxies it
  # in-cluster to the router (GRAPHQL_UPSTREAM). No CORS, router never exposed.
  GRAPHQL_URL: "/graphql"
  # In-cluster router base — nginx preserves the /graphql URI when proxying.
  GRAPHQL_UPSTREAM: "http://ingestion-subgraph.classification-service-sandbox.svc.cluster.local:8080"
  # Real AWS: presigned-PUT URLs target the public regional S3 endpoint, which
  # the browser can reach directly — no host rewrite. (The staging bucket needs
  # CORS for the cross-origin PUT — `make bucket-cors`, run by `bff-deploy`.)
  UPLOAD_REWRITE: ""
