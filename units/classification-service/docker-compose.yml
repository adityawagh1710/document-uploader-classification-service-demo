# Full local stack — LocalStack (S3 + DDB + SFN) + bootstrap seed + Lambda
# (via AWS Lambda RIE) + Next.js test UI. Run from the repository root:
#
#   docker compose up --build
#
# Endpoints:
#   UI:               http://localhost:3000
#   LocalStack:       http://localhost:4566
#   LocalStack health: http://localhost:4566/_localstack/health
#   Lambda RIE:       POST http://localhost:9000/2015-03-31/functions/function/invocations
#                     (body = the SFN task payload JSON)
#
# The UI talks to LocalStack directly via the in-process classifier wiring; the
# Lambda container is here so the deployed-Lambda code path is exercisable
# locally (smoke / regression) without SAM Local.

services:
  localstack:
    image: localstack/localstack:3.7.0
    environment:
      SERVICES: s3,dynamodb,stepfunctions,sqs
      DEFAULT_REGION: eu-west-1
      PERSISTENCE: "0"
      DEBUG: "0"
    ports:
      - "4566:4566"
    healthcheck:
      # LocalStack reports each service as one of: disabled / available / running / error.
      # We require both s3 and dynamodb to be in a ready state — accept both
      # 'available' (lazy-initialized) and 'running' (already touched).
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -qE '\"s3\": \"(available|running)\"' && curl -fsS http://localhost:4566/_localstack/health | grep -qE '\"dynamodb\": \"(available|running)\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  bootstrap:
    image: amazon/aws-cli:2.17.0
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-1
      AWS_ENDPOINT_URL: http://localstack:4566
      UI_S3_BUCKET: classification-ui-bucket
      CONTENT_HASH_TABLE_NAME: content-hashes-ui
      WORKSPACE_CONFIG_TABLE_NAME: workspace-config-ui
      CLASSIFICATIONS_TABLE_NAME: classifications-ui
      DEFAULT_WORKSPACE_ID: wks-ui-001
      ZIP_EXTRACTION_QUEUE_NAME: zip-extraction-queue
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    volumes:
      - ./scripts/bootstrap-localstack.sh:/bootstrap.sh:ro
    restart: "no"

  lambda:
    image: classification-service-lambda:dev
    build:
      context: .
      dockerfile: Dockerfile.lambda
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      CONTENT_HASH_TABLE_NAME: content-hashes-ui
      WORKSPACE_CONFIG_TABLE_NAME: workspace-config-ui
      ZIP_EXTRACTION_QUEUE_URL: http://localstack:4566/000000000000/zip-extraction-queue
      LOG_LEVEL: DEBUG
      POWERTOOLS_DEV: "true"
      POWERTOOLS_SERVICE_NAME: classification-service
      POWERTOOLS_METRICS_NAMESPACE: ClassificationService
      POWERTOOLS_LOGGER_LOG_EVENT: "false"
      POWERTOOLS_LOGGER_SAMPLE_RATE: "1.0"
    ports:
      # Map host 9000 → RIE 8080 inside the AWS Lambda image.
      - "9000:8080"

  # ── Synchronous classify endpoint ──────────────────────────────────────
  # The wire surface the wundergraph-router's classify resolver calls. Same
  # engine as the Lambda (shared composition), but request/response over HTTP.
  classification-http:
    image: classification-service-http:dev
    build:
      context: .
      dockerfile: Dockerfile.http
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      CONTENT_HASH_TABLE_NAME: content-hashes-ui
      WORKSPACE_CONFIG_TABLE_NAME: workspace-config-ui
      PORT: "8091"
    ports:
      - "8091:8091"

  ui:
    image: document-uploader-ui:dev
    build:
      # UI now lives in its own unit; build from the repo root so the Dockerfile
      # can reach both units/document-uploader-ui and the @svc sibling src.
      context: ../..
      dockerfile: units/document-uploader-ui/Dockerfile
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      UI_S3_BUCKET: classification-ui-bucket
      CONTENT_HASH_TABLE_NAME: content-hashes-ui
      WORKSPACE_CONFIG_TABLE_NAME: workspace-config-ui
      CLASSIFICATIONS_TABLE_NAME: classifications-ui
      ZIP_EXTRACTION_QUEUE_URL: http://localstack:4566/000000000000/zip-extraction-queue
      CONVERT_QUEUE_URL: http://localstack:4566/000000000000/classification-convert-queue
      # Presigned download URLs must be signed for a host the browser can
      # reach. The server talks to localstack:4566 internally, but the browser
      # is on the host where LocalStack is published on localhost:4566.
      S3_PUBLIC_ENDPOINT: http://localhost:4566
    ports:
      - "3000:3000"

  # ── Auto-convert worker (feat/03 + feat/04) ────────────────────────────
  # Polls the convert queue (bootstrapped by scripts/bootstrap-localstack.sh)
  # and bridges to office-convert. Disabled by default in the compose dev loop
  # because office-convert runs in ITS OWN compose stack — to wire them up
  # locally, either:
  #   1. Point OFFICE_CONVERT_BASE_URL at the office-convert host port:
  #        OFFICE_CONVERT_BASE_URL=http://host.docker.internal:8080 \
  #          docker compose --profile worker up worker
  #   2. Run office-convert + classification on a shared external network.
  #
  # Activated via `--profile worker` so the default `docker compose up`
  # stays minimal (LocalStack + bootstrap + lambda + ui).
  worker:
    image: classification-service-convert-worker:dev
    build:
      context: .
      dockerfile: worker/Dockerfile
    profiles: ["worker"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      CONVERT_QUEUE_URL: http://localstack:4566/000000000000/classification-convert-queue
      OFFICE_CONVERT_BASE_URL: ${OFFICE_CONVERT_BASE_URL:-http://host.docker.internal:8080}
      OFFICE_CONVERT_TIMEOUT_MS: "1800000"
      CLASSIFICATIONS_TABLE_NAME: classifications-ui
      LOG_LEVEL: debug
      WORKER_VERSION: compose-dev
      EXCLUDE_DWG: "true"
