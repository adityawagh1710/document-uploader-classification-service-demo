server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache the runtime config or the entry document.
    location = /config.js {
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA history fallback — client-side routes (/workspaces, /document-transfer,
    # /documents, /admin) must serve index.html so a refresh/deep-link works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── B-ready: same-origin GraphQL proxy ───────────────────────────────────
    # For dev05/prod, set GRAPHQL_URL=/graphql and uncomment this block so the
    # browser calls same-origin (no CORS, router not publicly exposed). The
    # upstream host is the in-cluster/in-network router service.
    # location /graphql {
    #     proxy_pass http://router:8099/graphql;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header Upgrade $http_upgrade;        # WS subscriptions
    #     proxy_set_header Connection "upgrade";
    # }
}
