server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache the runtime config or the entry document.
    location = /config.js {
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA history fallback — client-side routes (/workspaces, /document-transfer,
    # /documents, /admin) must serve index.html so a refresh/deep-link works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Same-origin GraphQL proxy (env-driven) ────────────────────────────────
    # One image serves both deployment modes:
    #   • local browser-direct — GRAPHQL_UPSTREAM unset → docker-entrypoint writes
    #     an EMPTY snippet → no /graphql location → the SPA calls GRAPHQL_URL
    #     (a full router URL) cross-origin.
    #   • dev05/prod same-origin — GRAPHQL_UPSTREAM=<in-cluster router base> +
    #     GRAPHQL_URL=/graphql → the entrypoint renders the location below, so the
    #     browser calls same-origin (no CORS, router stays ClusterIP-only).
    # The snippet is regenerated at container start; it always exists (the
    # Dockerfile seeds an empty one) so this include never fails to load. It
    # lives OUTSIDE conf.d/ so nginx's top-level `include conf.d/*.conf` doesn't
    # also pull it into the http context (where a `location` is illegal).
    include /etc/nginx/graphql-proxy.conf;
}
